name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:  # Allows manual trigger from Actions tab

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # Quarto is cached automatically by this action

      - name: Render site
        run: quarto render
        # Uses _freeze/ for pre-computed R output - no R installation needed

      - name: Materialize frozen figure assets
        shell: bash
        run: |
          set -euo pipefail
          # Quarto preserves frozen cell output but does not always copy its
          # figure files into the deployment tree. Supply both output layouts
          # used by knitr and Jupyter-backed posts.
          while IFS= read -r -d '' figure_dir; do
            relative="${figure_dir#_freeze/posts/}"
            slug="${relative%%/*}"
            document="${relative#*/}"
            document="${document%/figure-html}"

            for destination in \
              "docs/posts/${slug}/figure-html" \
              "docs/posts/${slug}/${document}_files/figure-html"; do
              mkdir -p "$destination"
              cp -a "$figure_dir"/. "$destination"/
            done
          done < <(find _freeze/posts -type d -path '*/figure-html' -print0)

      - name: Verify rendered image references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      source = dict(attrs).get("src")
                      if source:
                          self.sources.append(source)

          required_posts = {
              "2026-07-28-ecotourism",
              "2026-08-04-basotho-wool",
              "2026-08-11-palomar-spectroscopic-survey-nearby-galaxies",
          }
          missing = []
          checked = set()
          for html in Path("docs").rglob("*.html"):
              post = html.parent.name
              if post not in required_posts:
                  continue
              checked.add(post)
              parser = Images()
              parser.feed(html.read_text(encoding="utf-8", errors="replace"))
              for source in parser.sources:
                  parsed = urlparse(source)
                  if parsed.scheme or parsed.netloc or source.startswith("/") or source.startswith("#"):
                      continue
                  image = html.parent / unquote(parsed.path)
                  if not image.is_file() or image.stat().st_size == 0:
                      missing.append(f"{html}: {source}")
          absent = required_posts - checked
          if absent:
              missing.extend(f"Missing rendered HTML for {post}" for post in sorted(absent))
          if missing:
              raise SystemExit("Unresolved rendered image assets:\n" + "\n".join(missing))
          print(f"Rendered image asset verification passed for {len(checked)} posts")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
