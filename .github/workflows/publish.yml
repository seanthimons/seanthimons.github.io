name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:  # build only; deploy is skipped on PRs
  workflow_dispatch:  # Allows manual trigger from Actions tab

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check R chunks are frozen
        run: |
          missing=0
          while IFS= read -r f; do
            if grep -qE '^[[:space:]]*```+[[:space:]]*\{r[[:space:],}]' "$f" && [ ! -d "_freeze/${f%.qmd}" ]; then
              echo "::error file=$f::R chunks but no _freeze/${f%.qmd}/. Render locally and commit _freeze/."
              missing=1
            fi
          done < <(git ls-files -- '*.qmd')
          exit "$missing"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.6.42

      - name: Render site
        run: quarto render
        # Uses _freeze/ for pre-computed R output - no R installation needed

      - name: Materialize frozen figure assets
        shell: bash
        run: |
          set -euo pipefail
          # Quarto preserves frozen cell output but does not always copy its
          # figure files into the deployment tree. Supply both output layouts
          # used by knitr and Jupyter-backed posts.
          while IFS= read -r -d '' figure_dir; do
            relative="${figure_dir#_freeze/posts/}"
            slug="${relative%%/*}"
            document="${relative#*/}"
            document="${document%/figure-html}"

            for destination in \
              "docs/posts/${slug}/figure-html" \
              "docs/posts/${slug}/${document}_files/figure-html"; do
              mkdir -p "$destination"
              cp -a "$figure_dir"/. "$destination"/
            done
          done < <(find _freeze/posts -type d -path '*/figure-html' -print0)

          # Some legacy posts use an HTML-sidecar name that no longer matches
          # their Quarto filename. Resolve any remaining local figure reference
          # against its post's frozen figures instead of guessing the prefix.
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from shutil import copy2
          from urllib.parse import unquote, urlparse

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      source = dict(attrs).get("src")
                      if source:
                          self.sources.append(source)

          site = Path("docs").resolve()
          restored = []
          for html in site.rglob("*.html"):
              post = html.parent.name
              parser = Images()
              parser.feed(html.read_text(encoding="utf-8", errors="replace"))
              for source in parser.sources:
                  parsed = urlparse(source)
                  if parsed.scheme or parsed.netloc or source.startswith(("/", "#")):
                      continue
                  target = (html.parent / unquote(parsed.path)).resolve()
                  if not target.is_relative_to(site) or target.is_file() or "figure-html" not in target.parts:
                      continue
                  candidates = list(Path("_freeze/posts", post).glob(f"**/figure-html/{target.name}"))
                  if len(candidates) == 1:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      copy2(candidates[0], target)
                      restored.append(str(target.relative_to(site)))
                  elif len(candidates) > 1:
                      raise SystemExit(f"Ambiguous frozen figure for {target}: {candidates}")
          print(f"Restored {len(restored)} legacy figure assets")
          PY

      - name: Verify rendered image references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      source = dict(attrs).get("src")
                      if source:
                          self.sources.append(source)

          missing = []
          for html in Path("docs").rglob("*.html"):
              parser = Images()
              parser.feed(html.read_text(encoding="utf-8", errors="replace"))
              for source in parser.sources:
                  parsed = urlparse(source)
                  if parsed.scheme or parsed.netloc or source.startswith("/") or source.startswith("#"):
                      continue
                  image = html.parent / unquote(parsed.path)
                  if not image.is_file() or image.stat().st_size == 0:
                      missing.append(f"{html}: {source}")
          if missing:
              raise SystemExit("Unresolved rendered image assets:\n" + "\n".join(missing))
          print("Rendered image asset verification passed")
          PY

      - name: Verify Basotho Wool post completeness
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("docs/posts/2026-08-04-basotho-wool/2026-08-04-basotho-wool.html")
          text = html.read_text(encoding="utf-8", errors="replace")
          checks = {
              "figures": len(re.findall(r"<img\b", text, re.I)),
              "code_blocks": len(re.findall(r"<pre\b", text, re.I)),
              "code_cells": len(re.findall(r"cell-code", text, re.I)),
          }
          if checks["figures"] < 3 or (checks["code_blocks"] < 2 and checks["code_cells"] < 2):
              raise SystemExit(f"Incomplete Basotho Wool render: {checks}")
          print(f"Basotho Wool completeness passed: {checks}")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
